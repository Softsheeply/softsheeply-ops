name: shift_rest
description: Sleep planner for shift workers

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  timezone: ^0.9.4
  home_widget: ^0.5.0
  health: ^10.2.0
  share_plus: ^9.0.0
  in_app_review: ^2.0.9
  permission_handler: ^11.3.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
